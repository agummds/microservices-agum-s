apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/agummds/order-service:1.0
          ports:
            - containerPort: 3000
          env:
            - name: AMQP_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: PORT
              value: "3000"