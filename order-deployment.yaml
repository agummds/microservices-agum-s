# Menentukan versi API Kubernetes untuk resource Deployment
apiVersion: apps/v1

# Menentukan jenis resource Kubernetes, yaitu Deployment
kind: Deployment

metadata:
  # Nama Deployment untuk order-service
  name: order-service
  # Namespace tempat order-service dideploy
  namespace: ecommerce

spec:
  # Jumlah replica pod order-service
  replicas: 1
  # Selector untuk menentukan pod yang dikelola oleh Deployment ini
  selector:
    matchLabels:
      # Deployment ini akan mengelola pod dengan label app=order-service
      app: order-service

  # Template pod yang akan dibuat oleh Deployment
  template:
    metadata:
      # Label yang diberikan ke pod
      labels:
        app: order-service

    spec:
      # Daftar container yang dijalankan dalam pod
      containers:
        # Nama container order-service
        - name: order-service
          # Container image order-service yang diambil dari GitHub Packages (ghcr)
          image: ghcr.io/agummds/order-service:1.0
          # Port yang diekspos oleh container order-service
          ports:
            # Port aplikasi Express.js
            - containerPort: 3000
          # Environment variable yang dibutuhkan oleh aplikasi
          env:
            # URL koneksi ke RabbitMQ menggunakan service name internal Kubernetes
            - name: AMQP_URL
              value: amqp://guest:guest@rabbitmq:5672
            # Port yang digunakan oleh aplikasi Node.js
            - name: PORT
              value: "3000"